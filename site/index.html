<body>
<div id="app" data-theme="paper">
  <main id="viewport"><div id="content">
    <div style="padding-top:62px;max-width:350px;margin:0 auto;line-height:1.9;color:#292723">

      <p style="font-size:13px;color:#847f75">如果一直停留在这里，说明当前文件预览器未运行网页脚本。请使用浏览器打开已部署的 HTTPS 网址。</p>

  </div></main>

  <input type="file" id="import-file" accept="application/json,.json" hidden aria-label="选择错事备份 JSON 文件" />
</div>
<script>
(() => {
  'use strict';
  const STORAGE = 'cuoshi-standalone-prototype-v01'; // 保留旧存储键，升级不会丢掉数据
  const BACKUP_META = 'cuoshi-last-verified-backup-v01'; // 与私人记录分开存放
  let recoveryIssue = null;
  const MAX = 9999;
  const icons = {
    today:'<path d="M3 10.5 12 3l9 7.5V21h-6v-7H9v7H3z"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',
    stats:'<path d="M4 21V13M10 21V8M16 21V3M22 21v-9"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.05.05-2 2-.05-.05A1.7 1.7 0 0 0 15.9 18.5a1.7 1.7 0 0 0-1.1 1.55V21h-3v-.95a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.84.37l-.05.05-2-2 .05-.05A1.7 1.7 0 0 0 7.2 15a1.7 1.7 0 0 0-1.56-1.05H4.7v-3h.94A1.7 1.7 0 0 0 7.2 9.9a1.7 1.7 0 0 0-.34-1.87l-.05-.05 2-2 .05.05A1.7 1.7 0 0 0 10.7 6.4a1.7 1.7 0 0 0 1.1-1.55V4h3v.85a1.7 1.7 0 0 0 1.1 1.55 1.7 1.7 0 0 0 1.84-.37l.05-.05 2 2-.05.05A1.7 1.7 0 0 0 19.4 9.9a1.7 1.7 0 0 0 1.56 1.05h.94v3h-.94A1.7 1.7 0 0 0 19.4 15z"/>',
    arrow:'<path d="m14 6-6 6 6 6"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    minus:'<path d="M5 12h14"/>'
  };
  const app = document.getElementById('app');
  const content = document.getElementById('content');
  const nav = document.getElementById('bottom-nav');
  const dialog = document.getElementById('dialog-root');
  const importFile = document.getElementById('import-file');
  let toastHandle = null;
  let tab = 'today';
  let selectedDate = null;
  let month = null;
  let period = 'month';
  let draftNote = '';

  function localDate(d = new Date()) {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  const today = () => localDate();
  function shiftDate(key, days) {
    const [y,m,d]=key.split('-').map(Number);
    return localDate(new Date(y,m-1,d+days,12));
  }
  function dateObject(key) { const [y,m,d] = key.split('-').map(Number); return new Date(y,m-1,d,12); }
  function dateLabel(key, includeYear = false) {
    const d = dateObject(key); return `${includeYear ? d.getFullYear()+'年' : ''}${d.getMonth()+1}月${d.getDate()}日`;
  }
  function weekDay(key) { return '日一二三四五六'[dateObject(key).getDay()]; }
  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function svg(name) { return `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name]}</svg>`; }
  function id() { return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
  function timezone() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'local'; } catch { return 'local'; } }
  function nowMetadata() { return { at:new Date().toISOString(), opDate:today(), timezone:timezone() }; }
  function getDay(key) { return state.days[key] || {count:null,notes:[]}; }
  function typeNum(v) { return Number.isInteger(v) && v>=0 && v<=MAX; }
  function isDate(s) {

  function downloadRaw() {
    if(!recoveryIssue?.raw)return;
    const blob=new Blob([recoveryIssue.raw],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=`cuoshi-recovery-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);
  }
  function resetStorage() {
    openDialog(`<h2 id="dialog-title">确认放弃旧记录？</h2><p>这会永久清除浏览器当前保存的原始数据。如有需要，请先下载一份。</p><div class="modal-actions"><button data-close>取消</button><button id="confirm-reset" class="commit">确认清除并重新开始</button></div>`,()=>{
      dialog.querySelector('#confirm-reset').addEventListener('click',()=>{
        try { localStorage.removeItem(STORAGE);recoveryIssue=null;state=emptyState();closeDialog();goTab('today'); }
        catch(e){showToast('清理失败，请检查浏览器存储权限');}
      });
    });
  }
  function render() {
    app.dataset.theme=state.theme;
    if(recoveryIssue) { renderRecovery(); return; }
    content.innerHTML=tab==='today'?renderToday():tab==='calendar'?(selectedDate?renderDetail():renderCalendar()):tab==='stats'?renderStats():renderSettings();
    renderNav();
    // The note field is intentionally ephemeral; nothing requires an explanation to save a count.
  }
  function goTab(next) { tab=next; selectedDate=null; draftNote='';render();window.scrollTo(0,0); }
  function goDetail(key) { if(!isDate(key)||key>today())return; tab='calendar'; selectedDate=key; render();window.scrollTo(0,0); }
  function monthShift(change) {const [y,m]=month.split('-').map(Number);const d=new Date(y,m-1+change,1,12);month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();}
  function backupStatus() {
    const active=state.events.length>0;
    if(!active)return '';
    let meta=null;
    try { meta=JSON.parse(localStorage.getItem(BACKUP_META)||'null'); }catch(e){}
    const recent=meta&&typeof meta.at==='string'&&Number.isFinite(Date.parse(meta.at));
    const days=recent?(Date.now()-Date.parse(meta.at))/(86400*1000):Infinity;
    const changes=recent&&Number.isInteger(meta.events)?Math.max(0,state.events.length-meta.events):state.events.length;
    const due=(!recent&&state.events.length>=3)||(recent&&(days>=14||changes>=10));
    return due?'<div class="backup-hint"><strong>给这些记录留个备份吧。</strong><br>上一次确认备份已经有一段时间了。可以导出到「文件」App，放在自己信任的地方。</div>':
      '<p class="setting-hint">备份由你自己保管。如果换手机，记得先导出再导入。</p>';
  }
  function confirmBackup() {
    openDialog(`<h2 id="dialog-title">备份文件保存好了吗？</h2><p>请在「文件」或下载列表中确认能找到刚才的 JSON 文件。只有你确认后，我们才会记下这次备份时间；这不是云备份。</p><div class="modal-actions"><button data-close>稍后确认</button><button class="commit" id="backup-confirmed">已经保存好了</button></div>`,()=>{
      dialog.querySelector('#backup-confirmed').addEventListener('click',()=>{
        try {localStorage.setItem(BACKUP_META,JSON.stringify({at:new Date().toISOString(),events:state.events.length}));closeDialog();render();showToast('已记下这次备份');}
        catch(e){showToast('无法保存备份时间，请保管好导出的文件');closeDialog();}
      });
    });
  }
  function download() {
    try {
      const data=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);
      const blob=new Blob([data],{type:'application/json;charset=utf-8'});
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`错事备份_${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
      confirmBackup();
    }catch(e){console.error(e);showToast('无法开始下载备份，请稍后重试');}
  }
  function validate(s) {
    if(!s||s.version!==1||!['paper','modern'].includes(s.theme)||!s.days||typeof s.days!=='object'||Array.isArray(s.days)||!Array.isArray(s.events))throw Error('无效版本或格式');
    for(const [k,day] of Object.entries(s.days)){
      if(!isDate(k)||!day||!(day.count===null||typeNum(day.count))||!Array.isArray(day.notes))throw Error('日期记录格式不正确');
      for(const n of day.notes)if(!n||typeof n.id!=='string'||typeof n.text!=='string'||n.text.length>300)throw Error('简记不合法');
    }
    const ids=new Set();
    for(const e of s.events){
      if(!e||typeof e.id!=='string'||ids.has(e.id)||!isDate(e.targetDate)||!isDate(e.opDate)||typeof e.at!=='string'||!Number.isFinite(Date.parse(e.at))||typeof e.timezone!=='string'||!['initial','count','unrecord','note_add','note_edit','note_delete'].includes(e.type))throw Error('变更历史格式不正确');
      if(!(e.before===null||typeNum(e.before))||!(e.after===null||typeNum(e.after)))throw Error('数量格式不正确');
      if(e.timezone!=='local'){try{new Intl.DateTimeFormat('zh-CN',{timeZone:e.timezone});}catch{throw Error('时区不合法');}}
      if(e.delta!==((typeNum(e.before)&&typeNum(e.after))?e.after-e.before:null))throw Error('变化量不一致');
      ids.add(e.id);
    }
    // Reconstruct numerical snapshots, checking each event's before-state and the final record.
    const snapshots={};
    for(const e of s.events){
      if(['initial','count','unrecord'].includes(e.type)){
        const prior=Object.hasOwn(snapshots,e.targetDate)?snapshots[e.targetDate]:null;
        if(e.before!==prior)throw Error('变更历史不连续');
        if(e.type==='initial'&&e.before!==null)throw Error('首次记录事件错误');
        if(e.type==='count'&&(!typeNum(e.before)||!typeNum(e.after)))throw Error('数字调整事件错误');
        if(e.type==='unrecord'&&e.after!==null)throw Error('撤回事件错误');
        snapshots[e.targetDate]=e.after;
      }
    }
    for(const [key,day]of Object.entries(s.days))if(day.count!==(Object.hasOwn(snapshots,key)?snapshots[key]:null))throw Error('当前数据与修改历史不一致');
    return true;
  }
  function importBackup(file) {
    if(file.size>15*1024*1024)return showToast('文件过大，无法导入');
    const reader=new FileReader();
    reader.onload=()=>{
      try {
        const parsed=JSON.parse(String(reader.result));validate(parsed);
        openDialog(`<h2 id="dialog-title">导入这份备份？</h2><p>验证通过：${Object.keys(parsed.days).length} 个日期、${parsed.events.length} 条修改历史。导入将替换当前浏览器里的全部记录，建议先导出一份备份。</p><div class="modal-actions"><button data-close>取消</button><button class="commit" id="confirm-import">替换并导入</button></div>`,()=>{
          dialog.querySelector('#confirm-import').addEventListener('click',()=>{if(persist({version:1,theme:parsed.theme,days:parsed.days,events:parsed.events})){closeDialog();goTab('today');showToast('备份导入完成');}});
        });
      } catch(e) {showToast('导入失败：'+(e.message||'文件格式不正确'));}
    };reader.readAsText(file);
  }
  function clearAll() {
    openDialog(`<h2 id="dialog-title">删除全部记录？</h2><p>这会清除所有日期、简记与完整修改历史，不能从应用内恢复。请先导出备份。</p><div class="modal-actions"><button data-close>取消</button><button class="commit" id="confirm-clear">确认删除</button></div>`,()=>{
      dialog.querySelector('#confirm-clear').addEventListener('click',()=>{
        const clean={version:1,theme:state.theme,days:{},events:[]};
        if(persist(clean)){closeDialog();try{localStorage.removeItem(BACKUP_META);}catch(e){}goTab('today');showToast('所有记录已删除');}
      });
    });
  }
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t || dialog.contains(t))return;
    if(t.dataset.action==='export-raw')return downloadRaw();
    if(t.dataset.action==='reset-storage')return resetStorage();
    if(t.dataset.tab)return goTab(t.dataset.tab);
    const key=t.dataset.date, action=t.dataset.action;
    if(action==='plus')adjustCount(key,1);
    if(action==='minus')adjustCount(key,-1);
    if(action==='zero')changeCount(key,0);
    if(action==='edit-count')numberEditor(key);
    if(action==='edit-note')noteEditor(key,t.dataset.id);
    if(action==='detail')goDetail(key);
    if(action==='unrecord')confirmUnrecord(key);
    if(action==='back-calendar'){selectedDate=null;render();window.scrollTo(0,0);}
    if(action==='prev-month')monthShift(-1);
    if(action==='next-month'&&month<today().slice(0,7))monthShift(1);
    if(action==='period'){period=t.dataset.period;render();}
    if(action==='theme')transaction(s=>{s.theme=t.dataset.theme;});
    if(action==='export')download();
    if(action==='import')importFile.click();
    if(action==='clear')clearAll();
  });
  document.addEventListener('submit',e=>{
    if(e.target.matches('[data-note-date]')){e.preventDefault();const input=e.target.elements.note;addNote(e.target.dataset.noteDate,input.value);}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape' && dialog.innerHTML !== '')closeDialog();});
  importFile.addEventListener('change',()=>{const file=importFile.files?.[0];if(file)importBackup(file);importFile.value='';});
  // Small test hook for local browser acceptance checks; never exposed as navigation or UI.
  // 本地行为均在浏览器内完成；生产页面不暴露修改数据的调试入口。
  try { app.dataset.theme=state.theme; render(); }
  catch (error) { console.error('错事启动失败', error); const note = document.querySelector('#content p'); if (note) note.textContent='启动失败，请尝试在 Safari 或 Chrome 中重新打开此网页。'; }
  // HTTPS 与 localhost 上提供离线可用能力；文件预览模式不会注册 Service Worker。
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')) {
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
